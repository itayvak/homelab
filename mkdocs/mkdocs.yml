site_name: Itayvak Homelab Docs
site_url: https://docs.itayvak.com
repo_url: https://github.com/itayvak/homelab

theme:
    name: material
    font:
        text: Google Sans
        code: Google Sans Code

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences

nav:
    - Home: index.md
    - Services: services.md
    - Filesystem: filesystem.md
    - Networking: networking.md
    - Backups:
        - Backups: backups/backups.md
        - Immich: backups/backups-immich.md
