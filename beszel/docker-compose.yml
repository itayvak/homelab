services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://stats.itayvak.com
    volumes:
      - /apps/data/beszel/beszel_data:/beszel_data
      - /apps/data/beszel/beszel_socket:/beszel_socket
    networks:
      - homelab

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /apps/data/beszel/beszel_agent_data:/var/lib/beszel-agent
      - /apps/data/beszel/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: https://stats.itayvak.com
      TOKEN: ${TOKEN}
      KEY: ${KEY}

networks:
  homelab:
    external: true
