services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    container_name: planka
    restart: unless-stopped
    volumes:
      - /apps/data/planka/app-data:/app/data
    environment:
      - BASE_URL=https://boards.itayvak.com
      - DATABASE_URL=postgresql://postgres@planka_postgres/planka
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homelab

  postgres:
    image: postgres:16-alpine
    container_name: planka_postgres
    restart: unless-stopped
    volumes:
      - /apps/data/planka/db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab

networks:
  homelab:
    external: true
